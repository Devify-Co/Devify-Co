    <g transform="translate(750 110)"><circle r="27" fill="#0B1321" stroke="#8B5CF6" stroke-width="2"/><text y="6" fill="#B69CFF" font-size="18">03</text><text y="58" fill="#EFFFFF" font-size="14">DEVELOP</text></g>
